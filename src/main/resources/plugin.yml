name: ServerExtras
version: 1.1.0
main: pl.serwer.ServerExtras
api-version: '26.3'
description: Limity enchantów, backupy ekwipunku, enchant Dash i zaklęte kowadło.
commands:
  backup:
    description: Menu backupów ekwipunku graczy
    usage: /backup [gracz]
    permission: serverextras.backup
  enchantdash:
    description: Dash w kierunku patrzenia (przedmiot z Dash musi być w prawej ręce)
    usage: /enchantdash
  dashitem:
    description: Dodaje lub zdejmuje enchant Dash z przedmiotu w ręce
    usage: /dashitem <add|remove>
    permission: serverextras.admin
  giveanvil:
    description: Daje zaklęte kowadło
    usage: /giveanvil [gracz]
    permission: serverextras.admin
permissions:
  serverextras.backup:
    description: Dostęp do /backup i przywracania ekwipunków
    default: op
  serverextras.admin:
    description: Dostęp do /dashitem i /giveanvil
    default: op
